[workspace]
resolver = "2"
members = [
    "crates/stereo-audio",
    "crates/stereo-link",
]

[workspace.package]
version = "0.5.2"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wakewow/stereo-link"
description = "StereoLink 立体声链：把本机任意音频设备组合成左右声道，分别送给两台（或多台）音箱"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
