[workspace]
resolver = "2"
members = [
    "crates/stereo-audio",
    "crates/stereo-link",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/stereo-link"
description = "StereoLink 立体声链：用虚拟声卡把本机任意音频设备组合成左右声道立体声"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
