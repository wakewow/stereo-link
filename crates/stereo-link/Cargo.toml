[package]
name = "stereo-link"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "StereoLink 立体声链：把本机任意音频设备组合成左右声道分别输出"

[[bin]]
name = "stereo-link"
path = "src/main.rs"

[dependencies]
# GUI：egui/eframe（Windows 上默认走 glow/OpenGL，无需额外运行时）
eframe = { version = "0.31.1", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ctrlc.workspace = true

stereo-audio = { path = "../stereo-audio" }

# 系统托盘：直接调 Win32 Shell_NotifyIconW（自建隐藏窗口 + 消息泵线程，
# 不依赖 winit 事件循环，因此 eframe 窗口隐藏后托盘仍可用）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
